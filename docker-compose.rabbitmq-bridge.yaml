services:
  clara-rabbitmq-bridge:
    build:
      context: .
      dockerfile: services/rabbitmq-bridge/Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CLARA_INTERNAL_API_URL: ${CLARA_INTERNAL_API_URL}
      RABBITMQ_OUTBOX_POLL_MS: ${RABBITMQ_OUTBOX_POLL_MS:-1000}
      RABBITMQ_WEBHOOK_PREFETCH: ${RABBITMQ_WEBHOOK_PREFETCH:-10}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
