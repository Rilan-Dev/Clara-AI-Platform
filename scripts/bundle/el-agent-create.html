ordions inside the faq table */\n.faq-accordion-table td {\n  padding: 0;\n  /* Let td grow to fit expanded accordion content */\n  overflow: visible;\n}\n\n/* Reset all card/accordion chrome — border, shadow, bg, radius, dividers */\n.faq-accordion-table td .fern-accordion,\n.faq-accordion-table td .fern-card {\n  border: none !important;\n  border-radius: 0 !important;\n  box-shadow: none !important;\n  background: transparent !important;\n  --tw-divide-opacity: 0 !important;\n  width: 100% !important;\n  max-width: 100% !important;\n  margin: 0 !important;\n}\n\n.faq-accordion-table td .fern-accordion \u003e * + * {\n  border-top: none !important;\n}\n\n.faq-accordion-table td .fern-accordion-item {\n  border-radius: 0 !important;\n  border: none !important;\n}\n\n.faq-accordion-table td .fern-accordion-trigger,\n.faq-accordion-table td .fern-accordion-trigger[data-state=\"open\"],\n.faq-accordion-table td .fern-accordion-trigger[data-state=\"closed\"] {\n  border-radius: 0 !important;\n  padding: 14px 16px !important;\n}\n\n/* .fern-accordion-item has overflow:hidden which clips the Radix height animation\n   inside a table cell. Override the full chain to let content flow naturally. */\n.faq-accordion-table td .fern-accordion-item {\n  overflow: visible !important;\n}\n\n/* Radix sets height + overflow:hidden on the region during animation, and also\n   injects a content-width CSS var that constrains width. Override all of it. */\n.faq-accordion-table td [role=\"region\"] {\n  overflow: visible !important;\n  height: auto !important;\n  width: 100% !important;\n  animation: none !important;\n  transition: none !important;\n}\n\n.faq-accordion-table td [role=\"region\"] \u003e div {\n  padding-top: 0 !important;\n}\n\n/* Restore Tailwind Typography (prose) spacing inside faq-accordion-table.\n   .fern-table-root adds `not-prose` which has a :not() guard that blocks all\n   prose margin/spacing rules even when .prose is re-applied on a child element.\n   Since prose uses :where() (zero specificity), any class selector beats it. */\n.faq-accordion-table [role=\"region\"] p {\n  margin-top: 1.25em;\n  margin-bottom: 1.25em;\n}\n\n.faq-accordion-table [role=\"region\"] p:first-child {\n  margin-top: 0;\n}\n\n.faq-accordion-table [role=\"region\"] p:last-child {\n  margin-bottom: 0;\n}\n\n.faq-accordion-table [role=\"region\"] li {\n  margin-top: 0.5em;\n  margin-bottom: 0.5em;\n}\n\n.faq-accordion-table [role=\"region\"] ul,\n.faq-accordion-table [role=\"region\"] ol {\n  margin-top: 1.25em;\n  margin-bottom: 0.75em;\n}\n\n.faq-accordion-table [role=\"region\"] h4 {\n  margin-top: 1.5em;\n  margin-bottom: 0.5em;\n  line-height: 1.5;\n}\n\n/*----------------------------------------\n  Help Center Sidebar Styling\n----------------------------------------*/\n\n.fern-sidebar-link[href*=\"help-center\"].fern-sidebar-level-1 {\n  padding-top: 20px !important;\n  padding-bottom: 20px !important;\n  font-weight: 400 !important;\n}\n\na.fern-sidebar-link[href*=\"help-center\"] {\n  text-decoration-line: none !important;\n}\n\n.fern-sidebar-link[href*=\"help-center-directory\"].fern-sidebar-level-1 {\n  padding-top: 30px !important;\n  padding-bottom: 30px !important;\n}\n\n/* Even out the spacing between top-level Help Center sections. Fern groups\n   consecutive collapsible sections (Account, Product) into a sub-list with no\n   gap, while flat sections are direct children of the top list and each carry a\n   24px block margin — so Account↔Product sit tight but everything else is spaced\n   apart. Zero the top-level items' margins so all sections match Account/Product. */\nul.fern-sidebar-group.space-y-6:has(a.fern-sidebar-link[href*=\"help-center\"]) \u003e * {\n  margin-top: 0 !important;\n  margin-bottom: 0 !important;\n}\n\n/* Collapse the long lists of leaf FAQ articles in the Help Center sidebar: show\n   only section headers and the currently-active article. Every section header\n   has a child list in its \u003cli\u003e — either wrapped in a collapsible\n   \u003cdiv data-state=\"open|closed\"\u003e (sections that start collapsed) or as a sibling\n   \u003cul\u003e (sections rendered expanded). A leaf article is therefore a\n   .fern-sidebar-link whose \u003cli\u003e contains no nested \u003cul\u003e. `[href*='help-center']`\n   scopes this to the Help Center sidebar; the active article and the top-level\n   \"Help Center Directory\" link are always kept. */\nli:not(:has(ul))\n  \u003e a.fern-sidebar-link[href*=\"help-center\"]:not([data-state=\"active\"]):not(\n    [href$=\"help-center-directory\"]\n  ) {\n  display: none !important;\n}\n\n/* On a section's own landing page the section auto-expands but every article is\n   hidden by the rule above, which would leave an empty bordered \u003cul\u003e stub. Hide\n   any Help Center leaf-group (a group whose items are all articles — no nested\n   sub-section \u003cul\u003e or collapsible) that contains no active article. */\nul.fern-sidebar-group:has(a.fern-sidebar-link[href*=\"help-center\"]):not(\n    :has(a[data-state=\"active\"])\n  ):not(:has(li ul)):not(:has(li div[data-state])) {\n  display: none !important;\n}\n\n/* A root-level leaf section renders flat (no collapsible wrapper), so Fern places\n   its articles at level-1 — same indent as the header. Indent that non-collapsible\n   article group (identified as the \u003cul\u003e immediately following a section header,\n   without the `fern-collapsible` class) so its active article sits one level in,\n   matching how nested sections indent their articles. */\na.fern-sidebar-link[href*=\"help-center\"] + ul.fern-sidebar-group:not(.fern-collapsible) {\n  margin-left: 8px;\n  padding-left: 4px;\n  border-left: 1px solid var(--grayscale-a3);\n}\na.fern-sidebar-link[href*=\"help-center\"]\n  + ul.fern-sidebar-group:not(.fern-collapsible)\n  \u003e li\n  \u003e a.fern-sidebar-link {\n  padding-top: 6px !important;\n  padding-bottom: 6px !important;\n}\n\n/* Leaf-only sections (containing o
