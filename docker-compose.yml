## ─────────────────────────────────────────────────────────────────────────────
## Clara AI Platform — Docker Compose
##
## Services:
##   postgres          PostgreSQL 16 — persistent data store (host:5433 to avoid conflict)
##   qdrant            Qdrant vector database — internal only
##   clara-backend     Next.js 15 — routed via nginx-proxy-manager
##   clara-omen        Omen Insurance tenant app — routed via nginx-proxy-manager
##   clara-techvision  TechVision tenant app — routed via nginx-proxy-manager
##
## All app services are NOT port-bound to the host.
## External access is handled exclusively by nginx-proxy-manager via the
## shared nginx-proxy_default network (container hostname routing).
##
## Usage:
##   docker compose up --build -d          # build + start all (detached)
##   docker compose logs -f clara-backend  # stream backend logs
##   docker compose exec clara-backend npm run seed  # seed demo data
##   docker compose down                   # stop all services
##   docker compose down -v                # stop + remove volumes (destructive)
## ─────────────────────────────────────────────────────────────────────────────

name: clara-platform

networks:
  # Internal network: all Clara services communicate here
  clara-net:
    driver: bridge

  # External network owned by nginx-proxy-manager.
  # App services join this so NPM can proxy to them by container hostname.
  nginx-proxy_default:
    external: true

volumes:
  postgres-data:
  qdrant-data:

services:

  # ──────────────────────────────────────────────────────────────────────────
  # PostgreSQL 16
  # Host port remapped to 5433 to avoid conflict with existing postgres-db
  # container which already occupies 5432 on this host.
  # Internal apps connect via clara-net using hostname "postgres".
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clara-postgres
    restart: unless-stopped
    networks: [clara-net]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB:       ${POSTGRES_DB:-clara_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clara}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Qdrant Vector Database — internal only, no host port binding
  # Healthcheck uses wget (curl is not available in the distroless qdrant image)
  # ──────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: clara-qdrant
    restart: unless-stopped
    networks: [clara-net]
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Clara Backend (Next.js 15)
  #   Serves: marketing site, platform admin, RAG API, embed endpoint
  #
  #   NOT port-bound to host — NPM proxies to container name "clara-backend"
  #   on port 3000 via the nginx-proxy_default network.
  # ──────────────────────────────────────────────────────────────────────────
  clara-backend:
    build:
      context: ./clara-backend
      dockerfile: Dockerfile
    container_name: clara-backend
    restart: unless-stopped
    networks: [clara-net, nginx-proxy_default]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - ./clara-backend/.env
    environment:
      PORT:                  3000
      HOSTNAME:              "0.0.0.0"
      DATABASE_URL:          postgresql://${POSTGRES_USER:-clara}:${POSTGRES_PASSWORD:-clarapassword}@postgres:5432/${POSTGRES_DB:-clara_platform}
      QDRANT_URL:            http://qdrant:6333
      QDRANT_API_KEY:        ${QDRANT_API_KEY:-}
      OPENAI_API_KEY:        ${OPENAI_API_KEY}
      AUTH_SECRET:           ${AUTH_SECRET}
      NEXT_PUBLIC_APP_URL:   ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      POSTGRES_HOST:         postgres
      POSTGRES_PORT:         5432
      POSTGRES_USER:         ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD:     ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB:           ${POSTGRES_DB:-clara_platform}
      NODE_ENV:              production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Omen United Insurance — Tenant Demo
  #   NOT port-bound to host — NPM proxies to "clara-omen" on port 3001.
  # ──────────────────────────────────────────────────────────────────────────
  clara-omen:
    build:
      context: ./clara-omen-insurance
      dockerfile: Dockerfile
    container_name: clara-omen
    restart: unless-stopped
    networks: [clara-net, nginx-proxy_default]
    depends_on:
      clara-backend:
        condition: service_healthy
    environment:
      PORT:                      3001
      HOSTNAME:                  "0.0.0.0"
      CLARA_BACKEND_URL:         http://clara-backend:3000
      # CLARA_ORG_ID:              ${OMEN_ORG_ID:-10000000-0000-0000-0000-000000000001}
      # NEXT_PUBLIC_CLARA_API_URL: ${NEXT_PUBLIC_CLARA_API_URL:-http://localhost:3000}
      NODE_ENV:                  production
    env_file:
      - ./clara-omen-insurance/.env

  # ──────────────────────────────────────────────────────────────────────────
  # TechVision Solutions — Tenant Demo
  #   NOT port-bound to host — NPM proxies to "clara-techvision" on port 3002.
  # ──────────────────────────────────────────────────────────────────────────
  clara-techvision:
    build:
      context: ./clara-techvision
      dockerfile: Dockerfile
    container_name: clara-techvision
    restart: unless-stopped
    networks: [clara-net, nginx-proxy_default]
    depends_on:
      clara-backend:
        condition: service_healthy
    environment:
      PORT:                      3002
      HOSTNAME:                  "0.0.0.0"
      CLARA_BACKEND_URL:         http://clara-backend:3000
      # CLARA_ORG_ID:              ${CLARA_ORG_ID:-10000000-0000-0000-0000-000000000002}
      # NEXT_PUBLIC_CLARA_API_URL: ${NEXT_PUBLIC_CLARA_API_URL:-http://localhost:3000}
      NODE_ENV:                  production
    env_file:
      - ./clara-techvision/.env
      
