services:
  # ──────────────── Infrastructure ────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB: ${POSTGRES_DB:-clara_platform}
    ports:
      - "1234:5432"
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
    networks:
      - clara-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clara-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./infra/qdrant/storage:/qdrant/storage
    networks:
      - clara-net

  # ──────────────── Clara Backend ────────────────
  clara-backend:
    build:
      context: .
      dockerfile: clara-backend/Dockerfile
    container_name: clara-backend
    restart: unless-stopped
    env_file:
      - clara-backend/.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - qdrant
    networks:
      - clara-net

  # ──────────────── Clara Omen ────────────────
  clara-omen:
    build:
      context: .
      dockerfile: clara-omen-insurance/Dockerfile
    container_name: clara-omen
    restart: unless-stopped
    env_file:
      - clara-omen-insurance/.env
    ports:
      - "3001:3001"
    depends_on:
      - clara-backend
    networks:
      - clara-net

  # ──────────────── Clara TechVision ────────────────
  clara-techvision:
    build:
      context: .
      dockerfile: clara-techvision/Dockerfile
    container_name: clara-techvision
    restart: unless-stopped
    env_file:
      - clara-techvision/.env
    ports:
      - "3002:3002"
    depends_on:
      - clara-backend
    networks:
      - clara-net

networks:
  clara-net:
    driver: bridge
