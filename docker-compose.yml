services:
  # ──────────────── Infrastructure ────────────────
  redis:
    image: redis:7-alpine
    container_name: clara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/data:/data
    command: redis-server --appendonly yes
    networks:
      - clara-net

  postgres:
    image: postgres:16-alpine
    container_name: clara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB: ${POSTGRES_DB:-clara_platform}
    ports:
      - "1234:5432"
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
    networks:
      - clara-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clara-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./infra/qdrant/storage:/qdrant/storage
    networks:
      - clara-net

  # ──────────────── Clara Backend ────────────────
  # The backend Dockerfile lives at the repository root and expects the
  # repository root as its build context.
  clara-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clara-backend
    restart: unless-stopped
    env_file:
      - clara-backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SKIP_AUTH=false
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - qdrant
      - redis
    networks:
      - clara-net

  # ──────────────── Clara Worker (BullMQ) ────────────────
  clara-worker:
    build:
      context: .
      dockerfile: clara-backend/Dockerfile.worker
    container_name: clara-worker
    restart: unless-stopped
    env_file:
      - clara-backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CRAWL_WORKER_CONCURRENCY=2
      - RETRY_WORKER_CONCURRENCY=3
    depends_on:
      - redis
      - postgres
      - qdrant
    networks:
      - clara-net

