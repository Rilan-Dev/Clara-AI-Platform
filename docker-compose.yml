# ═══════════════════════════════════════════════════════════════════════════════
# Clara AI — self-hosted production stack (VPS / Docker)
# ═══════════════════════════════════════════════════════════════════════════════
#   cp .env.example .env            # fill in secrets (CRON_SECRET, REDIS_PASSWORD…)
#   sh scripts/vps-deploy.sh
#   docker compose ps               # every service should read "healthy"/"running"
#   sh scripts/vps-doctor.sh        # full health report
#
# Security: the infrastructure ports (Postgres, Redis, Qdrant, RabbitMQ) are
# bound to 127.0.0.1 by default. Docker-published ports bypass UFW/iptables
# host rules, so binding them to 0.0.0.0 put an unauthenticated Redis and
# Qdrant on the public internet. The app reaches them over the Compose
# network by service name (redis, postgres, qdrant, rabbitmq) — no public
# port is needed. For remote admin use an SSH tunnel:
#   ssh -p 2253 -L 5432:127.0.0.1:1234 root@<server>
# Only if something outside this host must reach them, set
# INFRA_BIND_ADDRESS=0.0.0.0 in .env (and set passwords/API keys first).
#
# Resource policy: production containers have explicit CPU/RAM/PID ceilings so
# a runaway worker, vector workload, or queue service cannot consume the whole
# host. Use scripts/vps-deploy.sh to build images serially on small hosts.
# ═══════════════════════════════════════════════════════════════════════════════

x-logging: &default-logging
  # Unbounded json-file logs eventually fill the disk, which is when
  # Postgres/Redis/Qdrant start failing intermittently.
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

secrets:
  clara_integration_encryption_key:
    environment: INTEGRATION_ENCRYPTION_KEY

services:
  # ───────────────── Infrastructure ─────────────────

  redis:
    image: redis:7-alpine
    container_name: clara-redis
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "384M"
          pids: 256
        reservations:
          memory: "128M"
    memswap_limit: "384M"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:6379:6379"
    volumes:
      - ./infra/redis/data:/data
    # requirepass is enabled when REDIS_PASSWORD is set in .env (the app and
    # worker read the same variable).
    command: >
      sh -c 'exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: clara-postgres
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1024M"
          pids: 512
        reservations:
          memory: "256M"
    memswap_limit: "1024M"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB: ${POSTGRES_DB:-clara_platform}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:1234:5432"
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  qdrant:
    # Pin a version (e.g. qdrant/qdrant:v1.15.4) with QDRANT_IMAGE once you
    # know which one the server runs — `latest` can jump a storage version on
    # the next pull. Never pin OLDER than the version that wrote the storage.
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: clara-qdrant
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1280M"
          pids: 512
        reservations:
          memory: "256M"
    memswap_limit: "1280M"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:6333:6333"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:6334:6334"
    volumes:
      - ./infra/qdrant/storage:/qdrant/storage

  # ──────────── Qwen3 local embeddings (llama.cpp) — OPT-IN ────────────
  # Self-hosted embedding backbone: Qwen3-Embedding-0.6B (Q8_0 GGUF, 1024-d,
  # 100+ languages, 32k context) served by llama.cpp's llama-server through
  # an OpenAI-compatible API. Registered as the governance provider "qwen"
  # (migration 076) — selectable in Settings → AI Platform → Embeddings
  # alongside OpenAI and Gemini, and the recommended endpoint for the
  # multilingual knowledge index (set MULTILINGUAL_EMBEDDINGS_BASE_URL to
  # http://qwen-embeddings:8080). ~1 GB RSS on CPU — a third of the retired
  # multilingual-e5-large TEI service.
  #
  # Deployed behind the compose profile "qwen": a plain `docker compose up -d`
  # (or `build`) SKIPS this service entirely — no container is created, no
  # CPU/RAM is reserved, and the platform embedding default stays on the
  # vendor APIs. Bring it up only when local embeddings are actually wanted:
  #   docker compose --profile qwen up -d qwen-embeddings
  # and stop it again with:
  #   docker compose --profile qwen stop qwen-embeddings && \
  #     docker compose --profile qwen rm -f qwen-embeddings
  # The model file (Qwen3-Embedding-0.6B-Q8_0.gguf, 639 MB) must be downloaded
  # into ./infra/qwen-embeddings before first start:
  #   curl -L -o infra/qwen-embeddings/Qwen3-Embedding-0.6B-Q8_0.gguf \
  #     https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf
  qwen-embeddings:
    # Opt-in profile: excluded from plain `up`/`build`/`ps` unless --profile qwen
    # (or an explicit service name) is given. Nothing else depends on it.
    profiles: ["qwen"]
    image: ${QWEN_EMBEDDINGS_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    container_name: clara-qwen-embeddings
    # A profiled service must not auto-restart after a host reboot while the
    # profile is inactive — restart only applies while the container exists.
    restart: unless-stopped
    logging: *default-logging
    # Embedding inference is memory-bound, not CPU-bound — 2 cores are enough
    # for query workloads; batch re-indexing simply takes longer. Same host
    # resource policy as the core services so it cannot bypass containment.
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "1536M"
          pids: 256
        reservations:
          memory: 384M
    memswap_limit: "1536M"
    # --pooling last is REQUIRED for Qwen3-Embedding (model card); -ub 8192
    # lets single-token pooling see whole chunks; --alias pins the model id
    # the governance catalogue and provider requests send.
    command:
      - -m
      - /models/Qwen3-Embedding-0.6B-Q8_0.gguf
      - --alias
      - Qwen/Qwen3-Embedding-0.6B
      - --embedding
      - --pooling
      - last
      - -ub
      - "8192"
      - -c
      - "8192"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:8088:8080"
    volumes:
      - ./infra/qwen-embeddings:/models
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ────────────────── Self-hosted RAG reranker (OPT-IN) ──────────────────
  # TEI cross-encoder on the private Compose network, never exposed publicly.
  # Start only on hosts with enough free RAM/CPU (measured: ~1.25GiB resident
  # with the ONNX backend; container limit below is 2560M):
  #   mkdir -p infra/rag-reranker
  #   docker compose --profile rerank up -d clara-reranker
  # Then set RAG_RERANK_URL=http://clara-reranker:80/rerank in backend .env,
  # recreate clara-backend, and run the in-image smoke probe:
  #   docker compose exec clara-backend node scripts/probe-rag-reranker.mjs
  # Plain 'docker compose up' does not start this resource-heavy service.
  #
  # Model note (measured 2026-10-29 on the 6-core CPU host, 2-CPU cap):
  #   Alibaba-NLP/gte-multilingual-reranker-base CANNOT be served by the cpu
  #   image (repo has no ONNX weights; the ORT backend fails and the candle
  #   fallback crash-loops without ever binding port 80). The default below
  #   ships ONNX weights and serves /rerank correctly on the ORT backend.
  #   IMPORTANT LANGUAGE LIMIT: mixedbread-ai/mxbai-rerank-base-v1 is tagged
  #   English ('en') in its official model card. Its successful English smoke
  #   probe does NOT prove Arabic/multilingual relevance. Benchmark each KB
  #   language before enabling; use a TEI-compatible multilingual model with
  #   working CPU/GPU weights when production multilingual RAG is required.
  #   CPU latency for a single 12-candidate batch: ~1.5s p50 with ~130-char
  #   snippets, ~3.9s p50 / ~4.7s p95 with realistic ~900-char chunks, and
  #   ~10s p50 at the 30-candidate maximum. The code's 1500ms default
  #   RAG_RERANK_TIMEOUT_MS therefore only suits short snippets on CPU:
  #   set RAG_RERANK_TIMEOUT_MS=6000 and consider RAG_RERANK_MAX_CANDIDATES=8
  #   for real chunks, or deploy a GPU TEI image instead.
  clara-reranker:
    profiles: ["rerank"]
    container_name: clara-reranker
    image: ${RAG_RERANK_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: "2560M"
          pids: 256
        reservations:
          memory: "768M"
    memswap_limit: "2560M"
    command:
      - --model-id
      - ${RAG_RERANK_MODEL:-mixedbread-ai/mxbai-rerank-base-v1}
    volumes:
      - ./infra/rag-reranker:/data

  # ──────────────── Local RabbitMQ ────────────────
  # Kept inside the Clara Docker network so the bridge connects by the
  # service name "rabbitmq". Management UI: http://127.0.0.1:15672 (tunnel).
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: clara-rabbitmq
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "384M"
          pids: 512
        reservations:
          memory: "128M"
    memswap_limit: "384M"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-clara}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-clara-rabbitmq-local}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:5672:5672"
      - "${INFRA_BIND_ADDRESS:-127.0.0.1}:15672:15672"
    volumes:
      - ./infra/rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ───────────────── Clara Backend ─────────────────

  clara-backend:
    build:
      context: .
      dockerfile: Dockerfile
      # The Dockerfile ends with the worker stage, so select the HTTP backend
      # runner explicitly for this Compose service.
      target: runner
      secrets:
        - clara_integration_encryption_key
    container_name: clara-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: "1536M"
          pids: 768
        reservations:
          memory: "384M"
    memswap_limit: "1536M"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SKIP_AUTH: "false"
    # Published for Nginx Proxy Manager. If NPM proxies to the container name
    # (clara-backend:3000 on the nginx-proxy_default network) you can bind
    # this to 127.0.0.1 as well.
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:4000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - default
      - npm-proxy

  # ──────────────── Clara Worker (BullMQ) ────────────────
  clara-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: clara-worker
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: "1024M"
          pids: 768
        reservations:
          memory: "256M"
    memswap_limit: "1024M"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CRAWL_WORKER_CONCURRENCY: ${CRAWL_WORKER_CONCURRENCY:-1}
      RETRY_WORKER_CONCURRENCY: ${RETRY_WORKER_CONCURRENCY:-1}
      # Exact disposable-KB canary only. Both defaults leave the feature OFF.
      # Configure these only after the tenant has created RAG-STAGING-* via RBAC.
      RAG_STAGING_PAGE_SECTION_CHUNKING: ${RAG_STAGING_PAGE_SECTION_CHUNKING:-false}
      RAG_STAGING_KB_ID: ${RAG_STAGING_KB_ID:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - default
      - npm-proxy

  # ──────────────── Clara RabbitMQ Bridge ────────────────
  # Relays the PostgreSQL transactional outbox to local RabbitMQ and delivers
  # webhook events. Keep this bridge private.
  clara-rabbitmq-bridge:
    build:
      context: ./services/rabbitmq-bridge
      dockerfile: Dockerfile
    container_name: clara-rabbitmq-bridge
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "256M"
          pids: 256
        reservations:
          memory: "64M"
    memswap_limit: "256M"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CLARA_INTERNAL_API_URL: http://clara-backend:3000
      # Vhost is environment-scoped: the default %2F ("/") keeps existing
      # deployments identical; a dev stack sharing this broker sets
      # RABBITMQ_VHOST=clara_dev (create it once via rabbitmqctl add_vhost).
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-clara}:${RABBITMQ_DEFAULT_PASS:-clara-rabbitmq-local}@rabbitmq:5672/${RABBITMQ_VHOST:-%2F}
      RABBITMQ_OUTBOX_POLL_MS: ${RABBITMQ_OUTBOX_POLL_MS:-1000}
      RABBITMQ_WEBHOOK_PREFETCH: ${RABBITMQ_WEBHOOK_PREFETCH:-10}
    depends_on:
      rabbitmq:
        condition: service_healthy
      clara-backend:
        condition: service_started
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================
networks:
  npm-proxy:
    external: true
    name: nginx-proxy_default
