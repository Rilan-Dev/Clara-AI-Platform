services:
  # ──────────────────────────────────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB: ${POSTGRES_DB:-clara_platform}
    ports:
      - "5433:5432"
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data
    networks:
      - clara-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clara} -d ${POSTGRES_DB:-clara_platform}"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clara-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./infra/qdrant/storage:/qdrant/storage
    networks:
      - clara-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Clara Backend (Vite + Express)
  #   Serves: marketing site, platform admin, RAG API, embed endpoint
  # ──────────────────────────────────────────────────────────────────────────
  clara-backend:
    build:
      context: ./clara-backend
      dockerfile: Dockerfile
    container_name: clara-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks: [clara-net]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    env_file: [.env]
    environment:
      PORT:                  3000
      HOSTNAME:              "0.0.0.0"
      DATABASE_URL:          postgresql://${POSTGRES_USER:-clara}:${POSTGRES_PASSWORD:-clarapassword}@postgres:5432/${POSTGRES_DB:-clara_platform}
      QDRANT_URL:            http://qdrant:6333
      QDRANT_API_KEY:        ${QDRANT_API_KEY:-}
      OPENAI_API_KEY:        ${OPENAI_API_KEY}
      AUTH_SECRET:           ${AUTH_SECRET}
      NEXT_PUBLIC_APP_URL:   ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      POSTGRES_HOST:         postgres
      POSTGRES_PORT:         5432
      POSTGRES_USER:         ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD:     ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB:           ${POSTGRES_DB:-clara_platform}
      NODE_ENV:              production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 60s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # Omen United Insurance — Tenant Demo (Vite + Express)
  # ──────────────────────────────────────────────────────────────────────────
  clara-omen:
    build:
      context: .
      dockerfile: clara-omen-insurance/Dockerfile
    container_name: clara-omen
    restart: unless-stopped
    ports:
      - "3101:3001"
    networks: [clara-net]
    depends_on:
      clara-backend: { condition: service_healthy }
    environment:
      PORT:                      3001
      HOSTNAME:                  "0.0.0.0"
      CLARA_BACKEND_URL:         http://clara-backend:3000
      NODE_ENV:                  production
    env_file:
      - ./clara-omen-insurance/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 5

  # ──────────────────────────────────────────────────────────────────────────
  # TechVision Solutions — Tenant Demo (Vite + Express)
  # ──────────────────────────────────────────────────────────────────────────
  clara-techvision:
    build:
      context: .
      dockerfile: clara-techvision/Dockerfile
    container_name: clara-techvision
    restart: unless-stopped
    ports:
      - "3102:3002"
    networks: [clara-net]
    depends_on:
      clara-backend: { condition: service_healthy }
    environment:
      PORT:                      3002
      HOSTNAME:                  "0.0.0.0"
      CLARA_BACKEND_URL:         http://clara-backend:3000
      NODE_ENV:                  production
    env_file:
      - ./clara-techvision/.env
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      start_period: 40s
      retries: 5

networks:
  clara-net:
    driver: bridge
