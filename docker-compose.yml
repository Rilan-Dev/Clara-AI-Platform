services:
  # ───────────────── Infrastructure ─────────────────

  redis:
    image: redis:7-alpine
    container_name: clara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./infra/redis/data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:16-alpine
    container_name: clara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clarapassword}
      POSTGRES_DB: ${POSTGRES_DB:-clara_platform}
    ports:
      - "1234:5432"
    volumes:
      - ./infra/postgres/data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clara-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./infra/qdrant/storage:/qdrant/storage

  # ───────────────── Local RabbitMQ ─────────────────

  # ──────────────── Local RabbitMQ ────────────────
  # RabbitMQ is kept inside the Clara Docker network so the bridge can connect
  # directly using the service name "rabbitmq". Management UI is available on
  # localhost:15672 for local administration. No external CloudAMQP is needed.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: clara-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-clara}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-clara-rabbitmq-local}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./infra/rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ───────────────── Clara Backend ─────────────────

  clara-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clara-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SKIP_AUTH: "false"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - qdrant
      - redis
    networks:
      - default
      - npm-proxy

  # ───────────────── Clara Worker ──────────────────

  # ──────────────── Clara Worker (BullMQ) ────────────────
  clara-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: clara-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CRAWL_WORKER_CONCURRENCY: 2
      RETRY_WORKER_CONCURRENCY: 3
    depends_on:
      - redis
      - postgres
      - qdrant
    networks:
      - default
      - npm-proxy

  # ──────────────── Clara RabbitMQ Bridge ────────────────
  # Relays the PostgreSQL transactional outbox to local RabbitMQ and delivers
  # webhook events. RabbitMQ runs inside this Compose project; no CloudAMQP is
  # required for local/self-hosted deployment. Keep this bridge private.
  clara-rabbitmq-bridge:
    build:
      context: ./services/rabbitmq-bridge
      dockerfile: Dockerfile
    container_name: clara-rabbitmq-bridge
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CLARA_INTERNAL_API_URL: http://clara-backend:3000
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-clara}:${RABBITMQ_DEFAULT_PASS:-clara-rabbitmq-local}@rabbitmq:5672/%2F
      RABBITMQ_OUTBOX_POLL_MS: ${RABBITMQ_OUTBOX_POLL_MS:-1000}
      RABBITMQ_WEBHOOK_PREFETCH: ${RABBITMQ_WEBHOOK_PREFETCH:-10}
    depends_on:
      rabbitmq:
        condition: service_healthy
      clara-backend:
        condition: service_started
      postgres:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

# =============================================================================
# Networks
# =============================================================================
networks:
  npm-proxy:
    external: true
    name: nginx-proxy_default

