# AUTOMATIC EXECUTION IS DISABLED BY PROJECT OWNER.
# Re-enable when desired by restoring the push/pull_request triggers below.
# Manual runs remain available from GitHub Actions via workflow_dispatch.
name: Cloud CI — Lint, Type Check & Tests

on:
  workflow_dispatch:
  # To re-enable automatic CI, restore:
  # push:
  #   branches: [Vercel-Prod]
  # pull_request:
  #   branches: [Vercel-Prod]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run test -- --run

  model-config:
    name: Validate Model Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run validate:model-config


  phase7-focused:
    name: Phase 7 Focused Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint active Phase 7 files
        run: npx eslint src/modules/ai-platform-core/*.ts src/modules/ai-core/types.ts src/modules/ai-core/providers/openai.ts src/modules/ai-core/providers/openai-tool-calling.test.ts
      - name: Typecheck active Phase 7 files
        run: npx tsc --noEmit --strict --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --esModuleInterop --jsx preserve --types vitest/globals src/modules/ai-platform-core/agentic-loop.ts src/modules/ai-platform-core/agentic-loop.test.ts src/modules/ai-platform-core/provider-tool-calling-pilot.ts src/modules/ai-platform-core/provider-tool-calling-pilot.test.ts src/modules/ai-core/types.ts src/modules/ai-core/providers/openai.ts src/modules/ai-core/providers/openai-tool-calling.test.ts


  ui-role-capabilities:
    name: UI Role & Permission Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Role capability contract tests
        run: npx vitest run src/lib/org-role-capabilities.test.ts
      - name: Typecheck role-aware UI surface
        run: >
          npx tsc --noEmit --strict --skipLibCheck --module esnext
          --moduleResolution bundler --target es2022 --esModuleInterop
          --jsx preserve --types vitest/globals
          src/lib/org-role-capabilities.ts
          src/lib/org-role-capabilities.test.ts
          src/features/admin/layouts/admin-shell.tsx
          src/features/admin/layouts/agent-topbar.tsx
          src/features/admin/screens/org-agents-screen.tsx
          src/features/admin/screens/agent-workspace/workspace-shell.tsx
      - name: Lint role-aware UI surface
        run: >
          npx eslint
          src/lib/org-role-capabilities.ts
          src/lib/org-role-capabilities.test.ts
          src/features/admin/layouts/admin-shell.tsx
          src/features/admin/layouts/agent-topbar.tsx
          src/features/admin/screens/org-agents-screen.tsx
          src/features/admin/screens/agent-workspace/workspace-shell.tsx

  governance-verification:
    name: Governance Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Phase closure eligibility
        run: bash docs/project-control/verification/phase-closure-eligibility-test.sh
      - name: Correction cycle
        run: bash docs/project-control/verification/correction-cycle-test.sh
      - name: Model configuration
        run: npm run validate:model-config

      - name: Library integrity
        run: node verification/validate-library.mjs
        working-directory: docs/doable-source

      - name: Immutable Doable-source manifest
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const manifest = JSON.parse(fs.readFileSync("docs/doable-source/verification/immutable-source-manifest.json", "utf8"));
          const expectedFiles = manifest.files ?? [];
          const failures = [];
          for (const entry of expectedFiles) {
            const ref = `HEAD:docs/doable-source/${entry.root}/${entry.path}`;
            let actual = "";
            try {
              actual = execFileSync("git", ["rev-parse", ref], { encoding: "utf8" }).trim();
            } catch {
              actual = "";
            }
            if (actual !== entry.sha) failures.push(`${entry.root}/${entry.path}: expected ${entry.sha}, got ${actual || "MISSING"}`);
          }
          if (expectedFiles.length !== 802) failures.push(`manifest file count is ${expectedFiles.length}, expected 802`);
          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          console.log(`Immutable manifest PASS: ${expectedFiles.length}/${expectedFiles.length} file blobs match.`);
          NODE

      - name: Vercel provenance
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:vercel.json)" = "3f26d343"

      - name: Runtime import boundary
        run: |
          set -euo pipefail
          if git grep -nE '(^|[[:space:](])((from|import|require)[[:space:]]*\(?["'"'"'][^"'"'"']*doable-source' -- src; then
            echo "Runtime import boundary violation detected."
            exit 1
          fi

      - name: Secret-pattern scan
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 88a6b5f9806c6526a7173c3e3cceff6ed77baba8 HEAD)"
          if [ -z "$changed" ]; then exit 0; fi
          if printf '%s\n' "$changed" | xargs grep -nE -I             '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|Bearer[[:space:]]+[A-Za-z0-9._-]{20,})' --; then
            echo "Secret-pattern match detected in changed paths."
            exit 1
          fi

  integrations-i1-focused:
    name: Integrations I-1 Focused Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Run I-1 contract tests
        run: npx vitest run src/modules/ai-platform-core/integrations/integration-contracts.test.ts
      - name: Typecheck I-1 contract surface
        run: npx tsc --noEmit --strict --skipLibCheck --module esnext --moduleResolution bundler --target es2022 --esModuleInterop --jsx preserve --types vitest/globals src/modules/ai-platform-core/integrations/integration-contracts.ts src/modules/ai-platform-core/integrations/integration-contracts.test.ts src/modules/ai-platform-core/contracts.ts src/modules/ai-platform-core/tool-contracts.ts src/modules/ai-platform-core/index.ts
      - name: Lint I-1 contract surface
        run: npx eslint src/modules/ai-platform-core/integrations/integration-contracts.ts src/modules/ai-platform-core/integrations/integration-contracts.test.ts src/modules/ai-platform-core/index.ts


  integrations-i2-focused:
    name: Integrations I-2 Focused Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Runtime redaction and egress tests
        run: npx vitest run src/modules/integrations/runtime/runner-fetch.test.ts src/modules/integrations/runtime/runner-helpers.test.ts
      - name: Credential vault and runner tests
        run: npx vitest run src/modules/integrations/runtime/credential-vault.test.ts src/modules/integrations/runtime/runner-core.test.ts
      - name: AI integration authorization/readiness tests
        run: npx vitest run src/modules/ai-platform-core/integration-action-tool.test.ts src/modules/ai-platform-core/integration-ai-tools.test.ts
      - name: Integration registry and control-plane tests
        run: npx vitest run src/modules/integrations/registry.test.ts
      - name: I-2 focused typecheck
        run: >
          npx tsc --noEmit --strict --skipLibCheck --module esnext
          --moduleResolution bundler --target es2022 --esModuleInterop
          --jsx preserve --types vitest/globals
          src/modules/integrations/runtime/credential-vault.ts
          src/modules/integrations/runtime/runner-core.ts
          src/modules/integrations/runtime/runner-fetch.ts
          src/modules/integrations/runtime/runner-helpers.ts
          src/modules/ai-platform-core/integration-action-tool.ts
          src/modules/ai-platform-core/integration-ai-tools.ts
      - name: I-2 focused lint
        run: >
          npx eslint
          src/modules/integrations/runtime/credential-vault.ts
          src/modules/integrations/runtime/runner-core.ts
          src/modules/integrations/runtime/runner-fetch.ts
          src/modules/integrations/runtime/runner-helpers.ts
          src/modules/ai-platform-core/integration-action-tool.ts
          src/modules/ai-platform-core/integration-ai-tools.ts


  docker-production-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Clara backend image
        run: docker build --file Dockerfile --tag clara-backend:ci --build-arg SKIP_AUTH=true .

  integration-control-plane:
    name: Integration Control Plane Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Registry tests
        run: npx vitest run src/modules/integrations/registry.test.ts
      - name: Typecheck integration control plane
        run: >
          npx tsc --noEmit --strict --skipLibCheck --module esnext
          --moduleResolution bundler --target es2022 --esModuleInterop
          --jsx preserve --types vitest/globals
          src/modules/integrations/types.ts
          src/modules/integrations/registry/index.ts
          src/modules/integrations/registry.test.ts
          src/modules/ai-platform-core/integration-ai-tools.ts
          src/app/api/platform/integrations/route.ts
          src/app/api/orgs/[orgId]/integrations/route.ts
          src/app/api/orgs/[orgId]/agents/[agentId]/integrations/route.ts
          src/features/admin/screens/platform-integrations-screen.tsx
          src/features/admin/screens/org-integrations-screen.tsx
          src/features/admin/screens/agent-integrations-screen.tsx
