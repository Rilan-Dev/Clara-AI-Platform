name: CI/CD — Build, Scan & Push

on:
  push:
    branches: [main, Vite-Converted]
  pull_request:
    branches: [main, Vite-Converted]

env:
  REGISTRY: docker.io
  IMAGE_NAME: riluraafu/clara-ai-rag

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test -- --run

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: lint
    # Pull requests build the exact Docker image but never publish it. Pushes
    # to main/Vite-Converted build and publish the deployable image.
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Vite-Converted'))
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        id: docker-login
        if: github.event_name == 'push'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Report Docker Hub authentication status
        if: github.event_name == 'push' && steps.docker-login.outcome != 'success'
        run: |
          echo "Docker Hub credentials are not available or authentication failed."
          echo "The image will be built but not published; configure DOCKER_USER and DOCKER_PASS repository secrets to enable publishing."

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable=${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
