name: Cloud CI — Lint, Type Check & Tests

on:
  push:
    branches: [main, Vite-Converted, Vercel-Prod, feat/cloud-only-free-runtime]
  pull_request:
    branches: [main, Vite-Converted, Vercel-Prod]

env:
  REGISTRY: docker.io
  IMAGE_NAME: riluraafu/clara-ai-rag

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm run test -- --run
      - name: Validate model configuration (WS-0.4)
        run: npm run validate:model-config

