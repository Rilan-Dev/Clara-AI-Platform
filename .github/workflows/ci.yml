name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ─── Type Check + Lint ────────────────────────────────────────────────────
  lint:
    name: Type check & lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [clara-backend, clara-omen-insurance, clara-techvision]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Type check
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        working-directory: ${{ matrix.app }}
        run: npm run lint --if-present

  # ─── Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        app: [clara-backend, clara-omen-insurance, clara-techvision]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
        env:
          DATABASE_URL:            postgresql://placeholder:placeholder@localhost:5432/placeholder
          QDRANT_URL:              http://localhost:6333
          OPENAI_API_KEY:          sk-placeholder
          AUTH_SECRET:             placeholder-secret-for-ci-build-only
          CLARA_BACKEND_URL:       http://localhost:3000
          CLARA_ORG_ID:            10000000-0000-0000-0000-000000000001
          NEXT_TELEMETRY_DISABLED: 1

  # ─── Docker build (main branch only) ─────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build clara-backend image
        uses: docker/build-push-action@v5
        with:
          context: ./clara-backend
          push: false
          tags: clara-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build clara-omen image
        uses: docker/build-push-action@v5
        with:
          context: ./clara-omen-insurance
          push: false
          tags: clara-omen:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build clara-techvision image
        uses: docker/build-push-action@v5
        with:
          context: ./clara-techvision
          push: false
          tags: clara-techvision:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
