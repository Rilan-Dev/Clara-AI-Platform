name: CI/CD — Build, Scan & Push

on:
  push:
    branches: [main, Vite-Converted]
  pull_request:
    branches: [main, Vite-Converted]

env:
  REGISTRY: docker.io
  IMAGE_NAME: riluraafu/clara-ai-rag

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Test
        run: npm run test -- --run
      - name: Validate model configuration (WS-0.4)
        run: npm run validate:model-config

  bridge-build:
    name: Build RabbitMQ Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build bridge image
        uses: docker/build-push-action@v6
        with:
          context: ./services/rabbitmq-bridge
          file: ./services/rabbitmq-bridge/Dockerfile
          push: false
          tags: clara-rabbitmq-bridge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [lint, bridge-build]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Vite-Converted'))
    permissions:
      contents: read
      packages: write
    outputs:
      published: ${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        id: docker-login
        if: github.event_name == 'push'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Report Docker Hub authentication status
        if: github.event_name == 'push' && steps.docker-login.outcome != 'success'
        run: |
          echo "Docker Hub credentials are not available or authentication failed."
          echo "The image will be built but not published; configure DOCKER_USER and DOCKER_PASS repository secrets to enable publishing."
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable=${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.docker-login.outcome == 'success' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Vite-Converted') && needs.build.result == 'success'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$VPS_SSH_KEY" || { echo "VPS_SSH_KEY is not configured"; exit 1; }
          test -n "$VPS_KNOWN_HOSTS" || { echo "VPS_KNOWN_HOSTS is not configured"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync application to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -eu
          test -n "$VPS_HOST" || { echo "VPS_HOST is not configured"; exit 1; }
          test -n "$VPS_USER" || { echo "VPS_USER is not configured"; exit 1; }
          test -n "$VPS_APP_DIR" || { echo "VPS_APP_DIR is not configured"; exit 1; }
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_APP_DIR'"
          rsync -az --delete \\
            --exclude '.git/' \\
            --exclude '.env' \\
            --exclude '.env.*' \\
            --exclude 'node_modules/' \\
            --exclude '.next/' \\
            --exclude 'infra/postgres/data/' \\
            --exclude 'infra/qdrant/storage/' \\
            --exclude 'infra/redis/data/' \\
            --exclude 'infra/rabbitmq/data/' \\
            -e "ssh -p $PORT" ./ "$VPS_USER@$VPS_HOST:$VPS_APP_DIR/"

      - name: Rebuild and restart Clara
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -eu
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_DIR' && docker compose up -d --build --remove-orphans"

      - name: Verify VPS health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          set -eu
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "cd '$VPS_APP_DIR' && for i in \$(seq 1 30); do if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then echo 'VPS health check passed'; exit 0; fi; sleep 5; done; echo 'VPS health check failed'; docker compose ps; docker compose logs --tail=100 clara-backend; exit 1"

  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
