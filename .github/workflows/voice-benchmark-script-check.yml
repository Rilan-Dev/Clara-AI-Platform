name: Voice Benchmark Script Checks

# Project-owner policy: all workflows are manual-only; no push, pull_request,
# schedule, or other automatic triggers. Run from Actions -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-checks:
    name: Syntax and report-validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check script syntax
        run: |
          node --check scripts/voice-benchmark/conversation.mjs
          node --check scripts/voice-benchmark/validate-report.mjs
          node --check scripts/voice-benchmark/validate-report.test.mjs
      - name: Test report validator
        run: node scripts/voice-benchmark/validate-report.test.mjs
