name: Voice Benchmark Script Checks

on:
  push:
    branches:
      - feature/ai-core-from-doable-source
    paths:
      - "scripts/voice-benchmark/**"
      - ".github/workflows/voice-benchmark-script-check.yml"
  pull_request:
    paths:
      - "scripts/voice-benchmark/**"
      - ".github/workflows/voice-benchmark-script-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  script-checks:
    name: Syntax and report-validator tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check script syntax
        run: |
          node --check scripts/voice-benchmark/conversation.mjs
          node --check scripts/voice-benchmark/validate-report.mjs
          node --check scripts/voice-benchmark/validate-report.test.mjs
      - name: Test report validator
        run: node scripts/voice-benchmark/validate-report.test.mjs
